<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mi cuenta')}"></head>
<body class="bg-fondo font-sans text-tinta antialiased">
<header th:replace="~{fragments/layout :: encabezado}"></header>
<main class="contenedor max-w-xl pb-28 pt-8">
	<div th:replace="~{fragments/layout :: aviso}"></div>
	<h1 class="titulo-display text-5xl">Mi cuenta</h1>

	<dl class="tarjeta mt-8 space-y-3 text-sm">
		<div>
			<dt class="text-tenue">Nombre</dt>
			<dd class="font-medium" th:text="${usuario.nombre}">Nombre</dd>
		</div>
		<div>
			<dt class="text-tenue">Email</dt>
			<dd class="font-medium" th:text="${usuario.email}">email</dd>
		</div>
		<div th:if="${usuario.negocioNombre != null}">
			<dt class="text-tenue">Barbería</dt>
			<dd class="font-medium" th:text="${usuario.negocioNombre}">Barbería</dd>
		</div>
		<div>
			<dt class="text-tenue">Rol</dt>
			<dd class="font-medium" th:text="${usuario.rol.etiqueta}">Barbero</dd>
		</div>
	</dl>

	<section class="mt-12">
		<h2 class="text-xl font-medium">Cambiar la contraseña</h2>
		<form th:action="@{/cuenta/contrasena}" th:object="${form}" method="post" class="mt-6 space-y-5" novalidate>
			<div>
				<label for="actual" class="rotulo">Contraseña actual</label>
				<input th:field="*{actual}" type="password" autocomplete="current-password" class="campo">
				<p th:if="${#fields.hasErrors('actual')}" th:errors="*{actual}" class="error-campo"></p>
			</div>
			<div>
				<label for="nueva" class="rotulo">Contraseña nueva</label>
				<input th:field="*{nueva}" type="password" autocomplete="new-password" class="campo">
				<p class="ayuda-campo">Mínimo 8 caracteres.</p>
				<p th:if="${#fields.hasErrors('nueva')}" th:errors="*{nueva}" class="error-campo"></p>
			</div>
			<div>
				<label for="repetida" class="rotulo">Repetí la contraseña nueva</label>
				<input th:field="*{repetida}" type="password" autocomplete="new-password" class="campo">
				<p th:if="${#fields.hasErrors('repetida')}" th:errors="*{repetida}" class="error-campo"></p>
			</div>
			<button type="submit" class="btn-principal w-full justify-center">Cambiar contraseña</button>
		</form>
	</section>

	<form th:action="@{/logout}" method="post" class="mt-12">
		<button type="submit" class="btn-secundario w-full">Salir</button>
	</form>
</main>
<nav th:replace="~{fragments/layout :: navegacion('cuenta')}"></nav>
</body>
</html>
