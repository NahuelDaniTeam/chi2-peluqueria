<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inicio')}"></head>
<body class="bg-fondo font-sans text-tinta antialiased">
<header th:replace="~{fragments/layout :: encabezado}"></header>
<main class="contenedor max-w-xl pb-28 pt-8">
	<p class="etiqueta" th:text="${usuario.rol.etiqueta}">Barbero</p>
	<h1 class="titulo-display mt-4 text-5xl" th:text="|Hola, ${usuario.nombre}|">Hola</h1>

	<section class="tarjeta mt-8">
		<h2 class="font-medium">Tu agenda</h2>
		<p class="mt-1 text-sm text-tenue">Acá vas a ver tus turnos del día. <span class="pendiente">Próximamente</span></p>
	</section>

	<a th:if="${usuario.dueno}" th:href="@{/equipo}" class="tarjeta mt-4 flex items-center justify-between gap-4 hover:border-tinta">
		<span>
			<span class="block font-medium">Tu equipo</span>
			<span class="mt-1 block text-sm text-tenue">Sumá a tus barberos para que puedan entrar.</span>
		</span>
		<span aria-hidden="true">→</span>
	</a>
</main>
<nav th:replace="~{fragments/layout :: navegacion('inicio')}"></nav>
</body>
</html>
