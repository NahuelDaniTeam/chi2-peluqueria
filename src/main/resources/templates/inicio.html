<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inicio')}"></head>
<body class="bg-fondo font-sans text-tinta antialiased">
<header th:replace="~{fragments/layout :: encabezado}"></header>
<main class="contenedor max-w-xl pb-28 pt-8">
	<p class="etiqueta" th:text="${usuario.rol.etiqueta}">Barbero</p>
	<h1 class="titulo-display mt-4 text-5xl" th:text="|Hola, ${usuario.nombre}|">Hola</h1>

	<!-- Puesta en marcha (solo el dueño, hasta que esté todo) -->
	<section th:if="${usuario.dueno and !pasosCompletos}" class="tarjeta mt-8">
		<h2 class="font-medium">Para empezar</h2>
		<p class="mt-1 text-sm text-tenue">Con esto listo, la barbería puede empezar a dar turnos.</p>
		<ol class="mt-4 space-y-1">
			<li th:each="p : ${pasos}">
				<a th:href="@{${p.enlace}}" class="-mx-2 flex min-h-11 items-center gap-3 rounded-xl px-2 hover:bg-fondo">
					<span class="flex size-6 shrink-0 items-center justify-center rounded-full border text-xs"
					      th:classappend="${p.hecho} ? 'border-tinta bg-tinta text-fondo' : 'border-linea'"
					      th:text="${p.hecho} ? '✓' : ''" aria-hidden="true"></span>
					<span th:classappend="${p.hecho} ? 'text-tenue line-through' : 'font-medium'" th:text="${p.texto}">Paso</span>
					<span th:unless="${p.hecho}" class="ml-auto" aria-hidden="true">→</span>
				</a>
			</li>
		</ol>
	</section>

	<section class="tarjeta mt-4" th:classappend="${usuario.dueno and !pasosCompletos} ? '' : 'mt-8'">
		<h2 class="font-medium">Tu agenda</h2>
		<p class="mt-1 text-sm text-tenue">Acá vas a ver los turnos del día. <span class="pendiente">Próximamente</span></p>
	</section>
</main>
<nav th:replace="~{fragments/layout :: navegacion('inicio')}"></nav>
</body>
</html>
