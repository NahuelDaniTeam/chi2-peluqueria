<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title th:text="${titulo} + ' · CHI2 Turnos'">CHI2 Turnos</title>
	<meta name="theme-color" content="#f7f4ee">
	<link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
	<link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
	<!-- Tipografías de la marca, iguales a la web principal (repo chi2) -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
	<link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<!-- Isotipo χ² (logo de CHI2, igual al de la web principal). Toma el color del texto; el "2" va en gris cálido. -->
<svg th:fragment="isotipo(clase)" th:class="${clase}" viewBox="10 11 44 41" fill="none" stroke-linecap="round" aria-hidden="true">
	<g transform="translate(-3 0)">
		<path d="M16 17C22 17 25 24 30 33S38 49 44 49" stroke="currentColor" stroke-width="4.5"/>
		<path d="M17 48 41 18" stroke="currentColor" stroke-width="2.2"/>
		<path d="M45.5 17.5C45.5 14.8 48 13.5 50.5 13.8 52.8 14.1 54 15.8 53.5 17.8 53 19.8 49.5 22 45.5 25.5H54"
		      stroke="#a8a29e" stroke-width="2.2" stroke-linejoin="round"/>
	</g>
</svg>

<!-- Logo del sistema: χ² | Turnos -->
<a th:fragment="logo" th:href="@{/}" class="flex shrink-0 items-center gap-3 text-tinta" aria-label="CHI2 Turnos, inicio">
	<svg th:replace="~{fragments/layout :: isotipo('h-7 w-auto')}"></svg>
	<span class="h-5 w-px bg-linea" aria-hidden="true"></span>
	<span class="font-display text-2xl leading-none tracking-wide">Turnos</span>
</a>

<!-- Encabezado: logo y, con sesión iniciada, la barbería -->
<header th:fragment="encabezado" class="sticky top-0 z-20 border-b border-linea/80 bg-fondo/85 backdrop-blur">
	<nav class="contenedor flex items-center justify-between gap-4 py-4">
		<a th:replace="~{fragments/layout :: logo}"></a>
		<span th:if="${usuario != null}" class="truncate text-sm font-medium text-tenue"
		      th:text="${usuario.negocioNombre != null ? usuario.negocioNombre : 'CHI2'}">Barbería</span>
	</nav>
</header>

<!-- Mensajes después de una acción (flash "aviso" si salió bien, "avisoError" si no) -->
<div th:fragment="aviso" th:if="${aviso != null or avisoError != null}" class="mb-6 space-y-2">
	<p th:if="${aviso}" class="aviso" role="status" th:text="${aviso}">Listo.</p>
	<p th:if="${avisoError}" class="aviso-error" role="alert" th:text="${avisoError}">No se pudo.</p>
</div>

<!-- Volver a la pantalla anterior: ~{fragments/layout :: volver(@{/ruta}, 'Texto')} -->
<a th:fragment="volver(destino, texto)" th:href="${destino}"
   class="-ml-1 inline-flex min-h-11 items-center gap-1 text-sm font-medium text-tenue hover:text-tinta">
	<span aria-hidden="true">←</span> <span th:text="${texto}">Volver</span>
</a>

<!--
  Navegación inferior, como en una app. "activo" es la pestaña actual: agenda, numeros, equipo, barberia, negocios
  o cuenta.
  Cada pantalla con navegación deja lugar abajo con pb-28 en el <main>.
-->
<nav th:fragment="navegacion(activo)" th:if="${usuario != null}" aria-label="Secciones"
     class="fixed inset-x-0 bottom-0 z-20 border-t border-linea bg-superficie/95 pb-[env(safe-area-inset-bottom)] backdrop-blur">
	<ul class="mx-auto flex max-w-md justify-around">
		<li th:unless="${usuario.admin}">
			<a th:href="@{/agenda}" class="pestana" th:classappend="${activo == 'agenda'} ? 'pestana-activa'">
				<svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
				Agenda
			</a>
		</li>
		<li th:unless="${usuario.admin}">
			<a th:href="@{/numeros}" class="pestana" th:classappend="${activo == 'numeros'} ? 'pestana-activa'">
				<svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg>
				Números
			</a>
		</li>
		<li th:if="${usuario.dueno}">
			<a th:href="@{/equipo}" class="pestana" th:classappend="${activo == 'equipo'} ? 'pestana-activa'">
				<svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2.1.7 3.5 2.7 3.5 5.7"/></svg>
				Equipo
			</a>
		</li>
		<li th:if="${usuario.dueno}">
			<a th:href="@{/barberia}" class="pestana" th:classappend="${activo == 'barberia'} ? 'pestana-activa'">
				<svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 7.8 20 18M8.5 16.2 20 6"/></svg>
				Barbería
			</a>
		</li>
		<li th:if="${usuario.admin}">
			<a th:href="@{/admin/negocios}" class="pestana" th:classappend="${activo == 'negocios'} ? 'pestana-activa'">
				<svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h18M4 9l1.5-5h13L20 9M5 9v11h14V9M9 20v-6h6v6"/></svg>
				Barberías
			</a>
		</li>
		<li>
			<a th:href="@{/cuenta}" class="pestana" th:classappend="${activo == 'cuenta'} ? 'pestana-activa'">
				<svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
				Mi cuenta
			</a>
		</li>
	</ul>
</nav>

</body>
</html>
