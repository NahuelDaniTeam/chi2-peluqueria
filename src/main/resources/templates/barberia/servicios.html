<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Servicios')}"></head>
<body class="bg-fondo font-sans text-tinta antialiased">
<header th:replace="~{fragments/layout :: encabezado}"></header>
<main class="contenedor max-w-xl pb-28 pt-4">
	<a th:replace="~{fragments/layout :: volver(@{/barberia}, 'Barbería')}"></a>
	<div th:replace="~{fragments/layout :: aviso}"></div>
	<h1 class="titulo-display mt-2 text-5xl">Servicios</h1>
	<p class="mt-2 text-sm text-tenue">La duración define cuánto lugar ocupa el turno en la agenda. Las combinaciones (ej. corte + barba) van como un servicio aparte.</p>

	<p th:if="${#lists.isEmpty(servicios)}" class="mt-8 text-tenue">Todavía no hay servicios. Cargá el primero acá abajo.</p>
	<ul class="mt-8 space-y-3">
		<li th:each="s : ${servicios}">
			<a th:href="@{/barberia/servicios/{id}(id=${s.id})}" class="tarjeta flex items-center justify-between gap-4 hover:border-tinta">
				<span class="min-w-0">
					<span class="block truncate font-medium" th:text="${s.nombre}">Corte</span>
					<span class="mt-1 block text-sm text-tenue" th:text="${s.duracionTexto}">30 min</span>
				</span>
				<span class="shrink-0 font-medium" th:text="${s.precioTexto}">$ 12.000</span>
			</a>
		</li>
	</ul>

	<section class="mt-12">
		<h2 class="text-xl font-medium">Agregar un servicio</h2>
		<form th:action="@{/barberia/servicios}" th:object="${form}" method="post" class="mt-6 space-y-5" novalidate>
			<div th:replace="~{barberia/servicio :: campos}"></div>
			<button type="submit" class="btn-principal w-full justify-center">Agregar</button>
		</form>
	</section>

	<section th:unless="${#lists.isEmpty(quitados)}" class="mt-12">
		<h2 class="text-xl font-medium">Ya no se ofrecen</h2>
		<ul class="mt-4 space-y-3">
			<li th:each="s : ${quitados}" class="tarjeta flex items-center justify-between gap-4 opacity-70">
				<span class="min-w-0">
					<span class="block truncate font-medium" th:text="${s.nombre}">Tintura</span>
					<span class="mt-1 block text-sm text-tenue" th:text="|${s.duracionTexto} · ${s.precioTexto}|">2 h · $ 30.000</span>
				</span>
				<form th:action="@{/barberia/servicios/{id}/reactivar(id=${s.id})}" method="post" class="shrink-0">
					<button type="submit" class="btn-secundario">Volver a ofrecer</button>
				</form>
			</li>
		</ul>
	</section>
</main>
<nav th:replace="~{fragments/layout :: navegacion('barberia')}"></nav>
</body>
</html>
