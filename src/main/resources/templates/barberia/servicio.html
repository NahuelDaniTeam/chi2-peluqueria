<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${servicio.nombre})}"></head>
<body class="bg-fondo font-sans text-tinta antialiased">
<header th:replace="~{fragments/layout :: encabezado}"></header>
<main class="contenedor max-w-xl pb-28 pt-4">
	<a th:replace="~{fragments/layout :: volver(@{/barberia/servicios}, 'Servicios')}"></a>
	<h1 class="titulo-display mt-2 text-5xl" th:text="${servicio.nombre}">Corte</h1>

	<form th:action="@{/barberia/servicios/{id}(id=${servicio.id})}" th:object="${form}" method="post" class="mt-8 space-y-5" novalidate>
		<!-- Campos del servicio: los usa también el alta en servicios.html -->
		<div th:fragment="campos" class="space-y-5">
			<div>
				<label for="nombre" class="rotulo">Nombre</label>
				<input th:field="*{nombre}" type="text" autocomplete="off" placeholder="Corte + barba" class="campo">
				<p th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="error-campo"></p>
			</div>
			<div>
				<label for="duracionMinutos" class="rotulo">Duración</label>
				<select th:field="*{duracionMinutos}" class="campo">
					<option th:each="d : ${duraciones}" th:value="${d.minutos}" th:text="${d.texto}">30 min</option>
				</select>
				<p th:if="${#fields.hasErrors('duracionMinutos')}" th:errors="*{duracionMinutos}" class="error-campo"></p>
			</div>
			<div>
				<label for="precio" class="rotulo">Precio</label>
				<div class="relative">
					<span class="pointer-events-none absolute inset-y-0 left-4 flex items-center text-tenue">$</span>
					<input th:field="*{precio}" type="text" inputmode="numeric" autocomplete="off" placeholder="12000" class="campo pl-8">
				</div>
				<p class="ayuda-campo">En pesos, sin centavos. Si algún barbero cobra distinto, se carga en su perfil.</p>
				<p th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}" class="error-campo"></p>
			</div>
		</div>
		<button type="submit" class="btn-principal w-full justify-center">Guardar cambios</button>
	</form>

	<form th:action="@{/barberia/servicios/{id}/quitar(id=${servicio.id})}" method="post" class="mt-6">
		<button type="submit" class="btn-secundario w-full">Dejar de ofrecer este servicio</button>
	</form>
</main>
<nav th:replace="~{fragments/layout :: navegacion('barberia')}"></nav>
</body>
</html>
