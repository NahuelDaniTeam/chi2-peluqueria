spring.application.name=chi2-peluqueria

# JPA: el esquema lo manejan las migraciones de Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Actuator: solo health expuesto
management.endpoints.web.exposure.include=health

# Acceso (ver SeguridadProperties). En producción, siempre por variables de entorno.
# Usuario de CHI2 que se crea al arrancar si no existe; sin estas dos variables no se crea.
chi2.seguridad.admin-email=${CHI2_ADMIN_EMAIL:}
chi2.seguridad.admin-contrasena=${CHI2_ADMIN_CONTRASENA:}
# Firma la cookie de "mantener la sesión iniciada". El valor por defecto es solo para desarrollo.
chi2.seguridad.clave-recordarme=${CHI2_CLAVE_RECORDARME:solo-para-desarrollo-cambiar-en-produccion}
